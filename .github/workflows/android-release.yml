name: Android CI / Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `tools` was removed from the SDK repository; request only what exists.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: elisdb-android
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        working-directory: elisdb-android
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        working-directory: elisdb-android
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: elisdb-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            elisdb-android/app/build/reports/tests/
            elisdb-android/app/build/reports/lint-results-debug.html

  instrumented:
    name: Instrumented tests (Room migrations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `tools` was removed from the SDK repository; request only what exists.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run migration tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          working-directory: elisdb-android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.elisdb.data.AppDatabaseMigrationTest

  release:
    name: Build & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `tools` was removed from the SDK repository; request only what exists.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elisdb-release.jks"

      - name: Build release APK
        working-directory: elisdb-android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/elisdb-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # The server publishes the APK by file name (elisdb-<version>-<code>.apk),
      # so the release asset must already carry the version the app reports.
      - name: Name the APK after its version
        working-directory: elisdb-android
        run: |
          version_name=$(sed -n 's/^app\.versionName=//p' gradle.properties)
          version_code=$(sed -n 's/^app\.versionCode=//p' gradle.properties)
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "app.versionName / app.versionCode missing from gradle.properties" >&2
            exit 1
          fi
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/elisdb-${version_name}-${version_code}.apk"
          echo "APK_NAME=elisdb-${version_name}-${version_code}.apk" >> "$GITHUB_ENV"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: elisdb-android/app/build/outputs/apk/release/${{ env.APK_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: elisdb-android/app/build/outputs/apk/release/${{ env.APK_NAME }}
          generate_release_notes: true

      # Publishes the build to the server, where the app picks it up from
      # "Sobre -> Procurar atualizações". Nothing restarts: the server discovers
      # the file by name on the next request.
      #
      # Skipped with a warning (instead of failing the release) until
      # DEPLOY_SSH_KEY, DEPLOY_HOST and DEPLOY_USER are configured.
      - name: Publish APK to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::warning::DEPLOY_SSH_KEY/DEPLOY_HOST/DEPLOY_USER not set; skipping server publication"
            exit 0
          fi
          port=${DEPLOY_PORT:-22}
          # Directory inside the data volume, as seen from the deploy user's home.
          target=${DEPLOY_PATH:-docker/elisdb-server/elisdb-data/apk/latest/}

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # A pinned host key is the strict option (DEPLOY_KNOWN_HOSTS holds the
          # line from `ssh-keyscan -H <host>`); the fallback trusts a fresh scan.
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS not set; trusting a fresh ssh-keyscan of the host"
            ssh-keyscan -p "$port" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

          # rsync uploads to a temporary name and renames on completion, so a
          # half-transferred file is never served.
          rsync --archive --compress --chmod=F644 \
            --rsh="ssh -i $HOME/.ssh/deploy_key -p $port -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "elisdb-android/app/build/outputs/apk/release/$APK_NAME" \
            "$DEPLOY_USER@$DEPLOY_HOST:$target"
          echo "published $APK_NAME to $DEPLOY_USER@$DEPLOY_HOST:$target"
