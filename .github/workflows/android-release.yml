name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `tools` was removed from the SDK repository; request only what exists.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        working-directory: elisdb-android
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        working-directory: elisdb-android
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        working-directory: elisdb-android
        run: ./gradlew :app:assembleDebug

      # Artifacts are only uploaded when something fails, so green runs never
      # consume the account's artifact storage. The debug APK is not published:
      # only GitHub Release assets (and the copy on the server) are kept.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            elisdb-android/app/build/reports/tests/
            elisdb-android/app/build/reports/lint-results-debug.html
          retention-days: 3
        continue-on-error: true

  instrumented:
    name: Instrumented tests (Room migrations)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `tools` was removed from the SDK repository; request only what exists.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run migration tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          working-directory: elisdb-android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.elisdb.data.AppDatabaseMigrationTest

  # Runs the whole instrumented suite (UI + Room) so regressions outside the
  # migration tests are visible in CI. It is deliberately non-blocking: the
  # `instrumented` job above remains the release gate, and a flaky UI test on
  # the CI emulator must never stop a release. The suite is also run locally
  # (`./gradlew :app:connectedDebugAndroidTest`).
  instrumented-suite:
    name: Instrumented tests (full suite, non-blocking)
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `tools` was removed from the SDK repository; request only what exists.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          working-directory: elisdb-android
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload instrumented reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: instrumented-reports
          path: elisdb-android/app/build/reports/androidTests/
          retention-days: 3
        continue-on-error: true

  release:
    name: Build & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, instrumented]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The release body is the hand-written section of CHANGELOG.md for this
      # tag — what changed, for the people who use the app — instead of the
      # generated "What's Changed"/"Full Changelog" text. Failing here, before
      # the build, is better than publishing a release with no notes.
      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section; add the release notes before tagging"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `tools` was removed from the SDK repository; request only what exists.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elisdb-release.jks"

      - name: Build release APK
        working-directory: elisdb-android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/elisdb-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # The server publishes the APK by file name (elisdb-<version>-<code>.apk),
      # so the release asset must already carry the version the app reports.
      - name: Name the APK after its version
        working-directory: elisdb-android
        run: |
          version_name=$(sed -n 's/^app\.versionName=//p' gradle.properties)
          version_code=$(sed -n 's/^app\.versionCode=//p' gradle.properties)
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "app.versionName / app.versionCode missing from gradle.properties" >&2
            exit 1
          fi
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/elisdb-${version_name}-${version_code}.apk"
          echo "APK_NAME=elisdb-${version_name}-${version_code}.apk" >> "$GITHUB_ENV"

      # The signed APK is attached to the GitHub Release below and copied to the
      # server. No workflow artifact is kept: Release assets have their own
      # storage and do not count against the Actions artifact quota.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: elisdb-android/app/build/outputs/apk/release/${{ env.APK_NAME }}
          # Notes written by hand in CHANGELOG.md (see "Extract release notes"),
          # not the generated commit list with a "Full Changelog" link.
          body_path: ${{ runner.temp }}/release-notes.md

      # Publishes the build to the server, where the app picks it up from
      # "Sobre -> Procurar atualizações". Nothing restarts: the server discovers
      # the file by name on the next request.
      #
      # Skipped with a warning (instead of failing the release) until
      # DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER and DEPLOY_KNOWN_HOSTS are
      # configured. A pinned host key is mandatory: a fresh ssh-keyscan would
      # trust whatever host answers, so the deploy is skipped rather than
      # weakened when DEPLOY_KNOWN_HOSTS is absent.
      - name: Publish APK to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::warning::DEPLOY_SSH_KEY/DEPLOY_HOST/DEPLOY_USER not set; skipping server publication"
            exit 0
          fi
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::warning::DEPLOY_KNOWN_HOSTS not set; skipping server publication (a pinned host key is required)"
            exit 0
          fi
          port=${DEPLOY_PORT:-22}
          # Directory inside the data volume, as seen from the deploy user's home.
          target=${DEPLOY_PATH:-docker/elisdb-server/elisdb-data/apk/latest/}

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # DEPLOY_KNOWN_HOSTS holds the pinned line from
          # `ssh-keyscan -H <host>`; StrictHostKeyChecking=yes below rejects any
          # other host key.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          # rsync uploads to a temporary name and renames on completion, so a
          # half-transferred file is never served.
          rsync --archive --compress --chmod=F644 \
            --rsh="ssh -i $HOME/.ssh/deploy_key -p $port -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "elisdb-android/app/build/outputs/apk/release/$APK_NAME" \
            "$DEPLOY_USER@$DEPLOY_HOST:$target"
          echo "published $APK_NAME to $DEPLOY_USER@$DEPLOY_HOST:$target"
