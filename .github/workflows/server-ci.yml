name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "elisdb-server/**"
      - "elisdb-memento/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "elisdb-server/**"
      - "elisdb-memento/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Named so the check is unambiguous next to the Android "Test" job.
    name: Server tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: elisdb-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: elisdb-server
        run: python -m pytest

      # The memento migration script is standalone (stdlib only), but it targets
      # the server schema, so it runs with the server's pytest from the same venv.
      - name: Run memento migration tests
        working-directory: elisdb-memento
        run: python -m pytest -q test_migrar_memento.py

  docker:
    # The server only reaches production as a container, so a dependency missing
    # from requirements.txt — or a broken Dockerfile/entrypoint — would first
    # show up on `docker compose up -d --build` on the VPS. Building the image
    # here, and importing the app inside it, catches that on the push instead.
    name: Docker image
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        working-directory: elisdb-server
        run: docker build --tag elisdb-server:ci .

      - name: Import the app inside the image
        # The entrypoint is bypassed on purpose: it provisions users and drops
        # privileges to PUID/PGID, which needs a mounted data directory. This
        # only needs to prove that the image can import every runtime module.
        run: |
          docker run --rm \
            --entrypoint python \
            --env ELISDB_DB=/tmp/ci.db \
            --env ELISDB_PHOTOS=/tmp/ci-photos \
            elisdb-server:ci \
            -c "import app.main, app.auth, app.database, app.ratelimit, app.updates; print('imports ok')"
