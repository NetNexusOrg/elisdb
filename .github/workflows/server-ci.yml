name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "elisdb-server/**"
      - "elisdb-telegram-bot/**"
      - "docs/**"
      - "scripts/check-docs.py"
      - "*.md"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "elisdb-server/**"
      - "elisdb-telegram-bot/**"
      - "docs/**"
      - "scripts/check-docs.py"
      - "*.md"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Named so the check is unambiguous next to the Android "Test" job.
    name: Server tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: elisdb-server/requirements-dev.txt

      - name: Install dependencies
        working-directory: elisdb-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: elisdb-server
        run: python -m pytest

      # Non-blocking dependency audit: report known CVEs without blocking normal
      # development, while Dependabot opens upgrade PRs for the findings.
      - name: Audit Python dependencies
        working-directory: elisdb-server
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      # The Telegram bot is also stdlib only; it shares the server's pytest.
      - name: Run telegram bot tests
        working-directory: elisdb-telegram-bot
        run: python -m pytest

      # Documentation is the operator manual: a dead link sends someone down a
      # blind alley, and the script is stdlib only, so this costs a second.
      - name: Check documentation links
        run: python scripts/check-docs.py

  docker:
    # The server only reaches production as a container, so a dependency missing
    # from requirements.txt — or a broken Dockerfile/entrypoint — would first
    # show up on `docker compose up -d --build` on the VPS. Building the image
    # here, and importing the app inside it, catches that on the push instead.
    name: Docker image
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        working-directory: elisdb-server
        run: docker build --file docker/Dockerfile --tag elisdb-server:ci .

      - name: Import the app inside the image
        # The entrypoint is bypassed on purpose: it creates the runtime
        # directories and needs a writable data directory. This only needs to
        # prove that the image can import every runtime module.
        run: |
          docker run --rm \
            --entrypoint python \
            --env ELISDB_DB=/tmp/ci.db \
            --env ELISDB_PHOTOS=/tmp/ci-photos \
            elisdb-server:ci \
            -c "import elisdb.main, elisdb.auth, elisdb.database, elisdb.ratelimit, elisdb.updates; print('imports ok')"
