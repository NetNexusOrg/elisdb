services:
  elisdb-server:
    build: .
    container_name: elisdb-server
    # Reinicia automaticamente após crash/reboot (mas não após `docker compose stop`).
    restart: unless-stopped
    ports:
      # Endereço onde a porta 8000 é publicada no host. Por omissão escuta
      # apenas em loopback, para o servidor não ficar exposto na LAN sem uma
      # decisão explícita. Para acesso direto na LAN define, por exemplo,
      # ELISDB_BIND_ADDRESS=0.0.0.0 (de preferência com TLS/proxy à frente).
      # Com um proxy TLS à frente, mantém 127.0.0.1 (ver docs/nginx-proxy-manager.md).
      - "${ELISDB_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - elisdb-data:/app/data
    # Impede que um processo dentro do contentor ganhe privilégios extra via
    # setuid/setgid. O entrypoint continua a poder fazer chown como root antes
    # de baixar para PUID/PGID.
    security_opt:
      - no-new-privileges:true
    environment:
      ELISDB_DB: /app/data/elisdb.db
      ELISDB_PHOTOS: /app/data/photos
      # Pacote Android servido pela app (Sobre -> Procurar atualizações).
      # Copia o APK para .../elisdb-data/apk/latest/ com o nome
      # elisdb-<versionName>-<versionCode>.apk (ex.: elisdb-1.6.0-11.apk).
      ELISDB_APK_DIR: /app/data/apk/latest
      # Utilizadores a provisionar no arranque (lista separada por vírgulas).
      # Vazio por omissão: nenhuma conta é criada sem uma escolha explícita.
      # Define, por exemplo, ELISDB_USERS=utilizador1,utilizador2 no teu .env/host.
      ELISDB_USERS: "${ELISDB_USERS:-}"
      # URL que os telemóveis usam para chegar ao servidor. Obrigatória apenas
      # quando ELISDB_USERS não está vazio; sem ela o arranque falha com uma
      # mensagem clara.
      ELISDB_SERVER_URL: "${ELISDB_SERVER_URL:-}"
      # Dono dos dados no arranque (chown feito pelo entrypoint).
      # Ajusta ao teu utilizador do host se usares um bind mount.
      PUID: "1000"
      PGID: "1000"
    # O servidor corre um único worker uvicorn (ver Dockerfile): o cache
    # anti-replay e o rate limiter são em memória. Não escales com múltiplos
    # workers/réplicas sem um backend partilhado.
    #
    # O servidor fala HTTP simples. Para o expor com HTTPS, põe um proxy
    # inverso à frente (ex.: Nginx Proxy Manager) — ver docs/nginx-proxy-manager.md.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  elisdb-data:
