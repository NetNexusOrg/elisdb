services:
  elisdb-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: elisdb-server
    # Reinicia automaticamente após crash/reboot (mas não após `docker compose stop`).
    restart: unless-stopped
    ports:
      # Endereço onde a porta 8000 é publicada no host. Por omissão escuta
      # apenas em loopback, para o servidor não ficar exposto na LAN sem uma
      # decisão explícita. Para acesso direto na LAN define, por exemplo,
      # ELISDB_BIND_ADDRESS=0.0.0.0 (de preferência com TLS/proxy à frente).
      # Com um proxy TLS à frente, mantém 127.0.0.1 (ver docs/nginx-proxy-manager.md).
      - "${ELISDB_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    # O contentor corre como o utilizador do host, nunca como root: o entrypoint
    # só cria diretórios e falha cedo se não puder escrever. Os bind sources
    # (`elisdb-data/` e `configs/`) têm de pertencer a PUID:PGID antes do `up`.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # Dados: elisdb.db, photos/, apk/, backups/.
      - "${ELISDB_DATA_DIR:-./elisdb-data}:/app/data"
      # Configurações dos dispositivos (seeds privadas). Fica fora do data dir
      # para o backup da BD/fotos não o arrastar e para ser legível na TUI.
      - "./configs:/app/data/configs"
    # Impede que um processo dentro do contentor ganhe privilégios extra via
    # setuid/setgid.
    security_opt:
      - no-new-privileges:true
    # Limites de recursos e rotação de logs: um contentor comprometido ou com
    # fuga de memória não deve esgotar o host.
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ELISDB_DB: /app/data/elisdb.db
      ELISDB_PHOTOS: /app/data/photos
      ELISDB_CONFIGS_DIR: /app/data/configs
      # Pacote Android servido pela app (Sobre -> Procurar atualizações).
      # Copia o APK para .../elisdb-data/apk/latest/ com o nome
      # elisdb-<versionName>-<versionCode>.apk (ex.: elisdb-1.6.0-11.apk).
      ELISDB_APK_DIR: /app/data/apk/latest
      # URL que os telemóveis usam para chegar ao servidor. Só é exigida ao
      # emitir uma chave (TUI ou `python -m elisdb.keys issue`).
      ELISDB_SERVER_URL: "${ELISDB_SERVER_URL:-}"
      ELISDB_LOG_LEVEL: "${ELISDB_LOG_LEVEL:-INFO}"
      ELISDB_TRUST_PROXY: "${ELISDB_TRUST_PROXY:-false}"
      ELISDB_MAX_PUSH_RECORDS: "${ELISDB_MAX_PUSH_RECORDS:-200}"
      ELISDB_MAX_PUSH_BYTES: "${ELISDB_MAX_PUSH_BYTES:-67108864}"
      ELISDB_MAX_PHOTOS_PER_CLIENT: "${ELISDB_MAX_PHOTOS_PER_CLIENT:-500}"
      ELISDB_MAX_PHOTO_BYTES: "${ELISDB_MAX_PHOTO_BYTES:-20971520}"
      ELISDB_MAX_PHOTO_BYTES_PER_KEY: "${ELISDB_MAX_PHOTO_BYTES_PER_KEY:-2147483648}"
      ELISDB_MAX_PHOTO_BYTES_TOTAL: "${ELISDB_MAX_PHOTO_BYTES_TOTAL:-21474836480}"
      ELISDB_RATE_LIMIT_REQUESTS: "${ELISDB_RATE_LIMIT_REQUESTS:-300}"
      ELISDB_RATE_LIMIT_WINDOW_SECONDS: "${ELISDB_RATE_LIMIT_WINDOW_SECONDS:-60}"
      ELISDB_TOMBSTONE_RETENTION_DAYS: "${ELISDB_TOMBSTONE_RETENTION_DAYS:-0}"
      ELISDB_AUDIT_RETENTION_DAYS: "${ELISDB_AUDIT_RETENTION_DAYS:-0}"
      ELISDB_PHOTO_GC_INTERVAL_SECONDS: "${ELISDB_PHOTO_GC_INTERVAL_SECONDS:-3600}"
      # Backups automáticos verificados. `ELISDB_BACKUP_DIR` vazio usa
      # <data dir>/backups; a retenção só apaga backups `auto-*`.
      ELISDB_BACKUP_INTERVAL_SECONDS: "${ELISDB_BACKUP_INTERVAL_SECONDS:-86400}"
      ELISDB_BACKUP_RETENTION: "${ELISDB_BACKUP_RETENTION:-3}"
      ELISDB_BACKUP_DIR: "${ELISDB_BACKUP_DIR:-}"
    # O servidor corre um único worker uvicorn (ver docker/Dockerfile): o cache
    # anti-replay e o rate limiter são em memória. Não escales com múltiplos
    # workers/réplicas sem um backend partilhado.
    #
    # O servidor fala HTTP simples. Para o expor com HTTPS, põe um proxy
    # inverso à frente (ex.: Nginx Proxy Manager) — ver docs/nginx-proxy-manager.md.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
